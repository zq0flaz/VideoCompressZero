name: Flutter compatibility

on:
  push:
    branches: [master, chore/flutter-latest-compatibility]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.41.0', '3.41.9', '3.44.0', '3.47.7']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example

  android-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.41.0', '3.41.9', '3.44.0', '3.47.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
        working-directory: example
      - run: ./gradlew :video_compress_zero:testDebugUnitTest
        working-directory: example/android

  ios-native:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.41.0', '3.41.9', '3.44.0', '3.47.7']
        packaging: [cocoapods, swiftpm]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods --no-document
      # A fresh consumer avoids depending on the example's migrated project,
      # its cached package graph, or its SPM-only configuration.
      - name: Create consumer
        run: |
          flutter create --platforms=ios --org com.example compatibility_host
          cd compatibility_host
          flutter pub add 'video_compress_zero:{"path":"../"}'
      - run: flutter config --no-enable-swift-package-manager
        if: matrix.packaging == 'cocoapods'
      - run: flutter config --enable-swift-package-manager
        if: matrix.packaging == 'swiftpm'
      - run: flutter build ios --simulator --debug
        working-directory: compatibility_host

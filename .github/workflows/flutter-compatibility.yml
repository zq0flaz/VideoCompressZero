name: Flutter compatibility

on:
  push:
    branches:
      - master
      - chore/flutter-latest-compatibility
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  dart-checks:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.41.9', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Analyze package
        run: flutter analyze
      - name: Test package
        run: flutter test
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Analyze example
        working-directory: example
        run: flutter analyze
